name: CrowMods Release Control

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
      staging_url:
        description: "Staging URL"
        required: true

permissions:
  contents: read

jobs:
  test-migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend tests
        working-directory: backend
        run: |
          npm install
          npm test

      - name: Build API
        run: docker build -f docker/api.Dockerfile -t crowmods-api:${{ inputs.release_version }} .

      - name: Build worker
        run: docker build -f docker/worker.Dockerfile -t crowmods-worker:${{ inputs.release_version }} .

      - name: Staging migration contract
        run: |
          echo "Run migrations against the staging database using deployment secrets."

      - name: Staging smoke contract
        env:
          BASE_URL: ${{ inputs.staging_url }}
        run: |
          ./scripts/smoke-test.sh

  canary-gate:
    runs-on: ubuntu-latest
    needs: test-migrate
    environment:
      name: production-canary

    steps:
      - uses: actions/checkout@v4

      - name: Canary decision
        env:
          ERROR_RATE: ${{ vars.CANARY_ERROR_RATE }}
          LATENCY_MS: ${{ vars.CANARY_LATENCY_MS }}
          HEALTH_PASS_RATE: ${{ vars.CANARY_HEALTH_PASS_RATE }}
        run: ./scripts/canary-gate.sh

  production:
    runs-on: ubuntu-latest
    needs: canary-gate
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Production deployment contract
        run: |
          echo "Deploy the already-tested immutable image digest."
          echo "Do not rebuild a different image between canary and production."

      - name: Post-deploy verification contract
        env:
          BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: ./scripts/deploy-verify.sh
