name: CrowMods CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t crowmods-api:ci .

      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t crowmods-worker:ci .
