services:
  - type: web
    name: crowmods-ai-integrated
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run lint && npm run typecheck && npm run migration:check && npm run integration:check && npm run build:web
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Super Admin

  - type: web
    name: crowmods-ai-web
    runtime: node
    plan: starter
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://crowmods-ai-integrated.onrender.com